<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Swiper</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            font-family: Arial, sans-serif;
        }

        .videoSlider {
            width: 100%;
            max-width: 1200px;
            margin: 80px auto;
            padding: 0 20px;
        }

        .videoSwiper {
            width: 100%;
        }

        .videoSwiper .swiper-slide {
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        .videoItem {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .videoIframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .videoThumbnail {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
            transition: opacity 0.3s ease;
        }

        .videoItem.playing .videoThumbnail {
            opacity: 0;
            pointer-events: none;
        }

        .videoButton {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80px;
            height: 80px;
            transform: translate(-50%, -50%);
            border: 0;
            border-radius: 50%;
            background: #fff;
            z-index: 5;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .videoButton:before {
            content: "";
            width: 0;
            height: 0;
            margin-left: 5px;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 18px solid #000;
        }

        .videoItem.playing .videoButton {
            opacity: 0;
        }

        .videoItem.playing:hover .videoButton {
            opacity: 1;
        }

        .videoItem.playing .videoButton:before {
            width: 18px;
            height: 24px;
            margin-left: 0;
            border: 0;
            background: linear-gradient(to right,
                    #000 0,
                    #000 6px,
                    transparent 6px,
                    transparent 12px,
                    #000 12px,
                    #000 18px);
        }

        .videoNavigation {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        .videoNavigation button {
            width: 50px;
            height: 50px;
            border: 0;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }

        @media (max-width: 767px) {
            .videoSlider {
                margin: 40px auto;
                padding: 0 15px;
            }

            .videoButton {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>

<body>

    <section class="videoSlider">

        <div class="swiper videoSwiper">

            <div class="swiper-wrapper">

                <div class="swiper-slide">
                    <div class="videoItem">
                        <iframe class="videoIframe"
                            src="https://www.youtube.com/embed/M7lc1UVf-VE?enablejsapi=1&playsinline=1&rel=0"
                            allow="autoplay; encrypted-media" allowfullscreen>
                        </iframe>
                        <img class="videoThumbnail" src="https://picsum.photos/id/1015/1200/675" alt="Video thumbnail">
                        <button type="button" class="videoButton" aria-label="Play video">
                        </button>
                    </div>
                </div>

                <div class="swiper-slide">
                    <div class="videoItem">
                        <iframe class="videoIframe"
                            src="https://www.youtube.com/embed/ScMzIvxBSi4?enablejsapi=1&playsinline=1&rel=0"
                            allow="autoplay; encrypted-media" allowfullscreen>
                        </iframe>
                        <img class="videoThumbnail" src="https://picsum.photos/id/1016/1200/675" alt="Video thumbnail">
                        <button type="button" class="videoButton" aria-label="Play video">
                        </button>
                    </div>
                </div>

                <div class="swiper-slide">
                    <div class="videoItem">

                        <iframe class="videoIframe"
                            src="https://www.youtube.com/embed/ysz5S6PUM-U?enablejsapi=1&playsinline=1&rel=0"
                            allow="autoplay; encrypted-media" allowfullscreen>
                        </iframe>

                        <img class="videoThumbnail" src="https://picsum.photos/id/1018/1200/675" alt="Video thumbnail">

                        <button type="button" class="videoButton" aria-label="Play video">
                        </button>

                    </div>
                </div>

                <div class="swiper-slide">
                    <div class="videoItem">

                        <iframe class="videoIframe"
                            src="https://www.youtube.com/embed/jNQXAC9IVRw?enablejsapi=1&playsinline=1&rel=0"
                            allow="autoplay; encrypted-media" allowfullscreen>
                        </iframe>

                        <img class="videoThumbnail" src="https://picsum.photos/id/1020/1200/675" alt="Video thumbnail">

                        <button type="button" class="videoButton" aria-label="Play video">
                        </button>

                    </div>
                </div>

            </div>

        </div>

        <div class="videoNavigation">
            <button type="button" class="videoPrev">←</button>
            <button type="button" class="videoNext">→</button>
        </div>

    </section>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const videoSwiper = new Swiper(".videoSwiper", {
            slidesPerView: 1,
            spaceBetween: 30,
            speed: 700,
            navigation: {
                nextEl: ".videoNext",
                prevEl: ".videoPrev"
            }
        });

        const videoItems = document.querySelectorAll(".videoItem");
        const players = [];

        function onYouTubeIframeAPIReady() {
            document.querySelectorAll(".videoIframe").forEach((iframe, index) => {
                players[index] = new YT.Player(iframe, {
                    events: {
                        onStateChange: function (event) {
                            if (event.data === YT.PlayerState.PLAYING) {
                                videoItems[index].classList.add("playing");
                                videoItems[index].querySelector(".videoButton").setAttribute("aria-label", "Pause video");

                                players.forEach((player, playerIndex) => {
                                    if (playerIndex !== index && player) {
                                        player.pauseVideo();
                                    }
                                });
                            }

                            if (event.data === YT.PlayerState.PAUSED) {
                                videoItems[index].classList.remove("playing");
                                videoItems[index].querySelector(".videoButton").setAttribute("aria-label", "Play video");
                            }

                            if (event.data === YT.PlayerState.ENDED) {
                                videoItems[index].classList.remove("playing");
                                videoItems[index].querySelector(".videoButton").setAttribute("aria-label", "Play video");
                            }
                        }
                    }
                });
            });
        }

        videoItems.forEach((item, index) => {
            const button = item.querySelector(".videoButton");

            button.addEventListener("click", function (e) {
                e.preventDefault();
                e.stopPropagation();

                const player = players[index];

                if (!player) {
                    return;
                }

                const state = player.getPlayerState();

                if (state === YT.PlayerState.PLAYING) {
                    player.pauseVideo();
                } else {
                    players.forEach((otherPlayer, otherIndex) => {
                        if (otherIndex !== index && otherPlayer) {
                            otherPlayer.pauseVideo();
                        }
                    });

                    player.playVideo();
                }
            });
        });

        videoSwiper.on("slideChange", function () {
            players.forEach((player, index) => {
                if (player) {
                    player.pauseVideo();
                }

                videoItems[index].classList.remove("playing");
            });
        });
    </script>

</body>

</html>
