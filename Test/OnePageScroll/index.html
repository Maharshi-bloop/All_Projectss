<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrolling Folds Effect</title>
    
    <style>
        /* styles.css */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #folds-container {
            position: relative;
            height: 100%;
        }

        .fold {
            position: absolute;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            background-color: #f2f2f2;
            transform: translateY(100%);
            opacity: 0;
            transition: transform 1s ease-out, opacity 1s ease-out;
        }

        #normal-scroll-content {
            display: none;
            padding: 20px;
            background-color: #fff;
            font-size: 1.2em;
            height: 100vh;
        }

        #normal-scroll-content h2 {
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div id="folds-container">
        <div class="fold" id="fold-1">Fold 1</div>
        <div class="fold" id="fold-2">Fold 2</div>
        <div class="fold" id="fold-3">Fold 3</div>
        <div class="fold" id="fold-4">Fold 4</div>
        <div class="fold" id="fold-5">Fold 5</div>
    </div>

    <div id="normal-scroll-content">
        <!-- Add your website's normal content here -->
        <h2>Normal Scrolling Content</h2>
        <p>This content appears after the scroll animation finishes.</p>
    </div>

    <script>


        let foldIndex = 0;
        const folds = document.querySelectorAll('.fold');
        const normalScrollContent = document.getElementById('normal-scroll-content');
        const foldCount = folds.length;

        window.addEventListener('scroll', handleScroll);

        function handleScroll() {
            const scrollPosition = window.scrollY;

            // Check if we are in the fold scroll range
            if (foldIndex < foldCount && scrollPosition > foldIndex * window.innerHeight) {
                // Animate fold by setting transform and opacity
                folds[foldIndex].style.transform = 'translateY(0)';
                folds[foldIndex].style.opacity = '1';
                foldIndex++;
            }

            // After the folds animation finishes, enable normal scrolling
            if (foldIndex === foldCount) {
                normalScrollContent.style.display = 'block';
                document.body.style.overflow = 'auto'; // Allow normal scrolling
                window.removeEventListener('scroll', handleScroll); // Remove the animation scroll listener
            }
        }
    </script>
</body>

</html>
